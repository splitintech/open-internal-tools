name: verification-adapter-sdk-codeql

on:
  push:
    paths:
      - "verification-adapter-sdk/**"
      - ".github/workflows/verification-adapter-sdk-codeql.yml"
  pull_request:
    paths:
      - "verification-adapter-sdk/**"
      - ".github/workflows/verification-adapter-sdk-codeql.yml"
  schedule:
    - cron: "18 7 * * 1"
  workflow_dispatch:

jobs:
  analyze:
    name: Analyze JavaScript/TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      security-events: write
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          source-root: verification-adapter-sdk
      - uses: github/codeql-action/analyze@v3
        with:
          category: "/language:javascript-typescript"
