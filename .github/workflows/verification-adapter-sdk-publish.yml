name: verification-adapter-sdk-publish

on:
  workflow_dispatch:
  push:
    tags:
      - "verification-adapter-sdk-v*"

permissions:
  contents: read

defaults:
  run:
    working-directory: verification-adapter-sdk

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: verification-adapter-sdk/package-lock.json
      - name: Install npm for OIDC trusted publishing
        run: npm install -g npm@11.5.1
        working-directory: .
      - run: npm --version
        working-directory: .
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run boundaries
      - run: npm run pack:inspect
      - run: npm run release:verify
      - name: Assert release tag matches package versions
        if: github.ref_type == 'tag'
        working-directory: .
        run: |
          node scripts/assert-release-tag.mjs \
            --tag "${{ github.ref_name }}" \
            --prefix verification-adapter-sdk-v \
            --workspace-root verification-adapter-sdk
      - name: Publish packages with OIDC provenance
        working-directory: .
        run: |
          node scripts/oidc-npm-publish.mjs --cwd verification-adapter-sdk \
            --workspace @splitin/verification-adapter-sdk \
            --workspace @splitin/verification-engine \
            --workspace @splitin/verification-postgres \
            --workspace @splitin/verification-adapter-stripe-identity \
            --workspace @splitin/verification-adapter-persona \
            --workspace @splitin/verification-adapter-plaid-idv \
            --workspace @splitin/verification-compat-splitin-v2 \
            --workspace @splitin/verification-server \
            --workspace @splitin/verification-web \
            --workspace @splitin/verification-cli \
            --workspace @splitin/verification-react
      - name: Create GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: .
        run: |
          if gh release view "${{ github.ref_name }}" >/dev/null 2>&1; then
            echo "Release ${{ github.ref_name }} already exists."
          else
            gh release create "${{ github.ref_name }}" \
              --verify-tag \
              --generate-notes \
              --title "verification-adapter-sdk ${{ github.ref_name }}"
          fi
