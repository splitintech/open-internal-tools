name: jpmc-zelle-quick-pay
on:
  pull_request:
    paths:
      ["jpmc-zelle-quick-pay/**", ".github/workflows/jpmc-zelle-quick-pay.yml"]
  push:
    paths:
      ["jpmc-zelle-quick-pay/**", ".github/workflows/jpmc-zelle-quick-pay.yml"]
    tags: ["jpmc-zelle-quick-pay-v*"]
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    working-directory: jpmc-zelle-quick-pay
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: zelle
          POSTGRES_PASSWORD: test_only
          POSTGRES_DB: zelle_test
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://zelle:test_only@127.0.0.1:5432/zelle_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: jpmc-zelle-quick-pay/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: npm pack --dry-run
  publish:
    needs: verify
    if: startsWith(github.ref, 'refs/tags/jpmc-zelle-quick-pay-v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install -g npm@11.5.1
      - run: npm ci
      - run: npm run build
      - run: node scripts/assert-release-tag.mjs --tag "${{ github.ref_name }}" --prefix jpmc-zelle-quick-pay-v --package jpmc-zelle-quick-pay/package.json
        working-directory: .
      - run: node scripts/oidc-npm-publish.mjs --cwd jpmc-zelle-quick-pay
        working-directory: .
