name: Contact converter
on:
  pull_request:
    paths: ['rtf-to-vcard/**', '.github/workflows/contact-converter.yml']
  push:
    branches: [main]
    paths: ['rtf-to-vcard/**', '.github/workflows/contact-converter.yml']
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.9', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install vobject==0.9.9 -r rtf-to-vcard/requirements.txt
      - run: python -m unittest discover -s rtf-to-vcard -p 'test_*.py' -v
      - run: python rtf-to-vcard/validate_vcards.py
      - run: python rtf-to-vcard/rtf_to_vcard.py rtf-to-vcard/example.rtf -o /tmp/rtf-smoke.vcf
