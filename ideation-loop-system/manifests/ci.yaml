display_information:
  name: Agent HQ CI
  description: GitHub failure follow-up. Taggable as @ci. Always hands off with NEXT @Cursor.
  background_color: "#1d1c1d"
features:
  bot_user:
    display_name: ci
    always_online: true
oauth_config:
  scopes:
    bot:
      - app_mentions:read
      - channels:history
      - channels:read
      - chat:write
      - groups:history
      - groups:read
settings:
  event_subscriptions:
    bot_events:
      - app_mention
  interactivity:
    is_enabled: true
  socket_mode_enabled: true
  org_deploy_enabled: false
  token_rotation_enabled: false
