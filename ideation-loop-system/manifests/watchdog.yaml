display_information:
  name: Agent HQ Watchdog
  description: Rate-limit and loop guard. Taggable as @watchdog. Never opens a new thread.
  background_color: "#1d1c1d"
features:
  bot_user:
    display_name: watchdog
    always_online: true
oauth_config:
  scopes:
    bot:
      - app_mentions:read
      - channels:history
      - channels:read
      - chat:write
      - groups:history
      - groups:read
settings:
  event_subscriptions:
    bot_events:
      - app_mention
      - message.channels
      - message.groups
  interactivity:
    is_enabled: true
  socket_mode_enabled: true
  org_deploy_enabled: false
  token_rotation_enabled: false
